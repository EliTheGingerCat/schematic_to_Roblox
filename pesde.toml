name = "elithegingercat/schematic_to_roblox"
version = "0.1.0"
description = "A Roblox plugin to convert Minecraft schematics to Roblox models."
authors = ["DarkenedRing", "EliTheGingerCat"]
repository = "https://github.com/EliTheGingerCat/schematic_to_Roblox"
license = "MIT"

[target]
environment = "roblox"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[scripts]
build = "./build.luau"
generate_block_properties = "./block_properties/generate.luau"
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"
test = "./tests"

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.5.1", target = "lune" }

[engines]
pesde = "^0.7.0"
lune = "^0.10.2"

[dependencies]
signal = { name = "molyidev/signal", version = "^1.0.1" }
fusion = { wally = "elttob/fusion", version = "^0.3.0" }
